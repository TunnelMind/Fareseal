# Trusted publishing (TunnelMind spec 094): a version tag publishes the five public
# @tunnelmindai/fareseal-* packages (core, cloudflare, hono, maze, adapter-x402) to npm with
# OIDC identity and provenance. cli and adapter-stripe are `"private": true`, so
# `pnpm -r publish` skips them. No registry token exists anywhere in this
# repository — the trusted publisher configured on npmjs.com binds this exact workflow file
# (publish.yml) in TunnelMind/Fareseal to the packages. The repo was renamed from
# TunnelMind/tollbooth on 2026-11-17, so the npm trusted publisher must name TunnelMind/Fareseal.
#
# Facts this relies on (docs.npmjs.com/trusted-publishers, read 2026-09-17): npm CLI ≥ 11.5.1
# and Node ≥ 22.14; `permissions: id-token: write`; provenance is generated automatically for
# a public package from a public repository; the workflow filename must match exactly.
#
# Dry run: `gh workflow run publish.yml --ref <tag> -f dry_run=true` performs the OIDC token
# request (and prints the decoded claims — never the token) and runs `pnpm publish --dry-run`.
#
# One path for every mode: run 35177528704 (v2.0.0-rc.1) failed the inline tag check, but the
# dispatch dry run (35177528100) had skipped that check (it was `if: push` only) and went green.
# The rules now live in scripts/release-check.mjs; the tag check runs whenever the ref is a tag,
# the packed-tarball check runs in every mode, and the only dry-run/real difference is the
# `--dry-run` flag on the single publish step.
name: publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]   # plain semver only — rc tags (v2.0.0-rc.1) never trigger a publish
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Request the OIDC token and dry-run the publish; nothing is published"
        type: boolean
        default: true

permissions:
  id-token: write   # OIDC — the only credential this workflow has
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: npm ≥ 11.5.1 (trusted publishing minimum)
        run: npm install -g npm@11.6.1 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: The tag must equal every package version (one repo-wide version)
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-check.mjs --tag "$GITHUB_REF_NAME"
      - name: Pack, then check the tarballs (no workspace:* ranges)
        run: |
          pnpm -r pack --pack-destination "$RUNNER_TEMP/packed"
          node scripts/release-check.mjs --packed "$RUNNER_TEMP/packed"

      - name: OIDC token claims (proof of the exchange; the token itself is never printed)
        id: oidc
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$tok"
          echo "$tok" | cut -d. -f2 | tr '_-' '/+' | awk '{ l=length($0)%4; if (l) $0=$0 substr("===",1,4-l); print }' | base64 -d | jq '{iss, aud, sub, repository, ref, workflow_ref, job_workflow_ref, runner_environment}'

      - name: Publish
        run: pnpm -r publish --access public --no-git-checks ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
